name: 🧪 Lint & Test

on:
  push:
    branches:
      - main

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning ./scripts/*.sh

      - name: Install bash_unit
        run: curl -s https://raw.githubusercontent.com/pgrange/bash_unit/master/install.sh | bash

      - name: Run unit tests
        run: FORCE_COLOR=true ./bash_unit tests/test-*
