name: Lint & Test

on:
  push:
    branches:
      - main
      - 'prerelease-**'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck --severity=warning ./*.sh

      - name: Install bash_unit
        run: curl -s https://raw.githubusercontent.com/pgrange/bash_unit/master/install.sh | bash

      - name: bash_unit tests
        run: FORCE_COLOR=true ./bash_unit tests/test-*

      - name: Slack notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SITE_DEPLOYMENTS_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.repository }}:${{ github.ref_name }} Lint & Test workflow failed"
